<!--
=========================================================
    Cheem Coding Loading Component
    Chat Cheem Coding - Meoz building
=========================================================
-->

<div

class="cheem-loading"

id="cheemLoading">


    <!--==============================
        Overlay
    ==============================-->

    <div

    class="loading-overlay"

    id="loadingOverlay">

    </div>



    <!--==============================
        Container
    ==============================-->

    <div

    class="loading-container"

    id="loadingContainer">


        <div

        class="loading-logo">


            <img

            src="../../assets/logo/OIP.jpg"

            alt="Cheem Coding Logo">


        </div>



        <div

        class="loading-spinner"

        id="loadingSpinner">

        </div>



        <h2

        class="loading-title"

        id="loadingTitle">

            Loading...

        </h2>



        <p

        class="loading-subtitle"

        id="loadingSubtitle">

            Please wait while Cheem Coding is preparing everything.

        </p>
                <!--==============================
            Progress
        ==============================-->

        <div

        class="loading-progress"

        id="loadingProgress">


            <div

            class="loading-progress-bar"

            id="loadingProgressBar">

            </div>

        </div>



        <!--==============================
            Percentage
        ==============================-->

        <div

        class="loading-percent"

        id="loadingPercent">

            0%

        </div>



        <!--==============================
            Status
        ==============================-->

        <div

        class="loading-status"

        id="loadingStatus">

            Initializing...

        </div>



        <!--==============================
            Tips
        ==============================-->

        <div

        class="loading-tip"

        id="loadingTip">

            Tip: You can press Ctrl + K to quickly search.

        </div>



        <!--==============================
            Step
        ==============================-->

        <div

        class="loading-step"

        id="loadingStep">

            Step 1 / 5

        </div>



        <!--==============================
            Custom Slot
        ==============================-->

        <div

        class="loading-slot"

        id="loadingSlot">

        </div>



        <!--==============================
            Watermark
        ==============================-->

        <div

        class="loading-watermark">

            Chat Cheem Coding - Meoz building

        </div>
                <!--==============================
            Screen Reader Status
        ==============================-->

        <div

        class="loading-accessibility"

        id="loadingAccessibility"

        role="status"

        aria-live="polite">

            Loading...

        </div>



        <!--==============================
            Animation Container
        ==============================-->

        <div

        class="loading-animation"

        id="loadingAnimation">

        </div>

    </div>

</div>



<!--==============================
    Component Hook
===============================-->

<div

id="loadingHook">

</div>
