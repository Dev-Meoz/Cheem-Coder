<!--
=========================================================
    Cheem Coding Popup Component
    Chat Cheem Coding - Meoz building
=========================================================
-->

<div

class="cheem-popup"

id="cheemPopup">


    <div

    class="popup-container"

    id="popupContainer">


        <!--==============================
            Header
        ==============================-->

        <div

        class="popup-header">


            <div

            class="popup-icon"

            id="popupIcon">

                ℹ️

            </div>


            <div

            class="popup-title-group">


                <h3

                id="popupTitle">

                    Popup Title

                </h3>


                <p

                id="popupSubtitle">

                    Popup description...

                </p>


            </div>


            <button

            class="popup-close"

            id="popupClose"

            aria-label="Close">

                ✕

            </button>

        </div>



        <!--==============================
            Body
        ==============================-->

        <div

        class="popup-body"

        id="popupBody">


            <!-- Dynamic Content -->


        </div>



        <!--==============================
            Actions
        ==============================-->

        <div

        class="popup-actions"

        id="popupActions">


            <button

            class="popup-button secondary"

            id="popupCancel">

                Cancel

            </button>


            <button

            class="popup-button primary"

            id="popupConfirm">

                OK

            </button>

        </div>
                <!--==============================
            Loading
        ==============================-->

        <div

        class="popup-loading"

        id="popupLoading">


            <div

            class="popup-spinner">

            </div>


            <span>

                Loading...

            </span>


        </div>



        <!--==============================
            Progress
        ==============================-->

        <div

        class="popup-progress"

        id="popupProgress">


            <div

            class="popup-progress-bar"

            id="popupProgressBar">

            </div>


        </div>



        <!--==============================
            Notification
        ==============================-->

        <div

        class="popup-notification"

        id="popupNotification"

        role="status"

        aria-live="polite">

        </div>



        <!--==============================
            Timer
        ==============================-->

        <div

        class="popup-timer"

        id="popupTimer">

            0s

        </div>



        <!--==============================
            Custom Content Slot
        ==============================-->

        <div

        class="popup-slot"

        id="popupSlot">

        </div>



        <!--==============================
            Watermark
        ==============================-->

        <div

        class="popup-watermark">

            Chat Cheem Coding - Meoz building

        </div>
                <!--==============================
            Keyboard Shortcuts
        ==============================-->

        <div

        class="popup-shortcuts">


            <div>

                <kbd>Esc</kbd>

                Close

            </div>


            <div>

                <kbd>Enter</kbd>

                Confirm

            </div>


        </div>



        <!--==============================
            Animation Container
        ==============================-->

        <div

        class="popup-animation"

        id="popupAnimation">

        </div>

    </div>

</div>



<!--==============================
    Component Hook
===============================-->

<div

id="popupHook">

</div>
