name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

</title>

<link
rel="icon"
href="../../assets/logo/favicon.ico">

<link

<link
rel="stylesheet"
href="../../css/theme.css">

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:var(--background);

    color:var(--text);

    font-family:Inter,sans-serif;

}

.errorCard{

    width:min(90%,620px);

    padding:48px;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:20px;

    text-align:center;

}

.errorCode{

    font-size:96px;

    font-weight:800;

    color:#f59e0b;

}

.errorTitle{

    font-size:32px;

    margin:16px 0;

}

.errorText{

    opacity:.8;

    line-height:1.6;

    margin-bottom:28px;

}

.actions{

    display:flex;

    justify-content:center;

    gap:16px;

    flex-wrap:wrap;

}

.actions a{

    text-decoration:none;

    padding:12px 24px;

    border-radius:12px;

    background:#f59e0b;

    color:#fff;

    font-weight:600;

    transition:.25s;

}

.actions a:hover{

    transform:translateY(-2px);

}

.footer{

    margin-top:30px;

    opacity:.7;

    font-size:14px;

}

</style>

</head>

<body>

<div class="errorCard">

    <div class="errorCode">

        505

    </div>

    <h1 class="errorTitle">

        HTTP Version Not Supported

    </h1>

    <p class="errorText">

        Phiên bản giao thức HTTP mà trình duyệt hoặc máy khách sử dụng
        không được máy chủ Cheem Coding hỗ trợ.

    </p>

    <div class="actions">

        <a href="../chat/index.html">

            Quay lại Chat

        </a>

        <a href="../../index.html">

            Trang chủ

        </a>

    </div>

    <div class="footer">

        Chat Cheem Coding - Meoz building

    </div>

</div>

</body>

</html>
