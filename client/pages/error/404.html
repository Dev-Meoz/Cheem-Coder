<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:var(--background);

    color:var(--text);

    font-family:Inter,sans-serif;

}

.errorCard{

    width:min(90%,600px);

    padding:48px;

    border-radius:20px;

    background:var(--surface);

    border:1px solid var(--border);

    text-align:center;

}

.errorCode{

    font-size:96px;

    font-weight:800;

    color:var(--primary);

}

.errorTitle{

    font-size:32px;

    margin:12px 0;

}

.errorText{

    opacity:.8;

    margin-bottom:28px;

}

.actions{

    display:flex;

    justify-content:center;

    gap:16px;

    flex-wrap:wrap;

}

.actions a{

    text-decoration:none;

    padding:12px 22px;

    border-radius:12px;

    background:var(--primary);

    color:#fff;

    font-weight:600;

}

.footer{

    margin-top:28px;

    opacity:.65;

    font-size:14px;

}

</style>
