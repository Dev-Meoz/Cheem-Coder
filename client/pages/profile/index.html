<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Cheem Coding | Profile

</title>

<link
rel="icon"
href="../../assets/logo/favicon.ico">

<link
rel="stylesheet"
href="../../css/root.css">

<link
rel="stylesheet"
href="../../css/theme.css">

<link
rel="stylesheet"
href="../../css/animation.css">

<link
rel="stylesheet"
href="profile.css">

</head>

<body>

<div class="profilePage">

    <!-- Sidebar -->

    <aside class="profileSidebar">

        <div class="profileLogo">

            <img

            src="../../assets/logo/OIP.jpg"

            alt="Cheem">

            <h2>

                Cheem Coding

            </h2>

        </div>

        <nav>

            <a href="../chat/index.html">

                💬 Chat

            </a>

            <a

            class="active"

            href="./index.html">

                👤 Profile

            </a>

            <a href="../settings/index.html">

                ⚙ Settings

            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="profileMain">

        <header class="profileHeader">

            <h1>

                Hồ sơ tài khoản

            </h1>

            <span>

                Chat Cheem Coding - Meoz building

            </span>

        </header>

        <section class="profileCard">

            <div class="avatarBox">

                <img

                id="profileAvatar"

                src="../../assets/images/default-avatar.png"

                alt="Avatar">

                <button

                id="changeAvatar">

                    Change Avatar

                </button>

                <input

                hidden

                type="file"

                id="avatarInput"

                accept="image/*">

            </div>

            <div class="profileInfo">

                <div class="field">

                    <label>

                        Username

                    </label>

                    <input

                    id="username"

                    type="text">

                </div>

                <div class="field">

                    <label>

                        Email

                    </label>

                    <input

                    id="email"

                    type="email"

                    readonly>

                </div>

                <div class="field">

                    <label>

                        Bio

                    </label>

                    <textarea

                    id="bio"

                    rows="4">

                    </textarea>

                </div>
                                <div class="field">

                    <label>

                        Country

                    </label>

                    <select id="country">

                        <option value="VN">

                            Việt Nam

                        </option>

                        <option value="US">

                            United States

                        </option>

                        <option value="JP">

                            Japan

                        </option>

                        <option value="KR">

                            Korea

                        </option>

                    </select>

                </div>

                <div class="field">

                    <label>

                        Language

                    </label>

                    <select id="language">

                        <option value="vi">

                            Vietnamese

                        </option>

                        <option value="en">

                            English

                        </option>

                    </select>

                </div>

                <div class="field">

                    <label>

                        Joined

                    </label>

                    <input

                    id="joined"

                    type="text"

                    readonly>

                </div>

                <div class="field">

                    <label>

                        Account Type

                    </label>

                    <input

                    id="accountType"

                    type="text"

                    value="Free"

                    readonly>

                </div>

            </div>

        </section>

        <section class="profileStats">

            <div class="statCard">

                <h3 id="totalChats">

                    0

                </h3>

                <span>

                    Conversations

                </span>

            </div>

            <div class="statCard">

                <h3 id="totalMessages">

                    0

                </h3>

                <span>

                    Messages

                </span>

            </div>

            <div class="statCard">

                <h3 id="totalTokens">

                    0

                </h3>

                <span>

                    Tokens

                </span>

            </div>

            <div class="statCard">

                <h3 id="totalFiles">

                    0

                </h3>

                <span>

                    Uploaded Files

                </span>

            </div>

        </section>

        <section class="profileActions">

            <button id="saveProfile">

                Save Changes

            </button>

            <button id="resetProfile">

                Reset

            </button>

        </section>

    </main>

</div>

<footer class="profileFooter">

    <span>

        Chat Cheem Coding - Meoz building

    </span>

</footer>

<script src="../../js/storage.js"></script>

<script src="../../js/utils.js"></script>

<script src="profile.js"></script>

</body>

</html>
