<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Cheem Coding | Profile

</title>

<link
rel="icon"
href="../../assets/logo/favicon.ico">

<link
rel="stylesheet"
href="../../css/root.css">

<link
rel="stylesheet"
href="../../css/theme.css">

<link
rel="stylesheet"
href="../../css/animation.css">

<link
rel="stylesheet"
href="profile.css">

</head>

<body>

<div class="profilePage">

    <!-- Sidebar -->

    <aside class="profileSidebar">

        <div class="profileLogo">

            <img

            src="../../assets/logo/OIP.jpg"

            alt="Cheem">

            <h2>

                Cheem Coding

            </h2>

        </div>

        <nav>

            <a href="../chat/index.html">

                💬 Chat

            </a>

            <a

            class="active"

            href="./index.html">

                👤 Profile

            </a>

            <a href="../settings/index.html">

                ⚙ Settings

            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="profileMain">

        <header class="profileHeader">

            <h1>

                Hồ sơ tài khoản

            </h1>

            <span>

                Chat Cheem Coding - Meoz building

            </span>

        </header>

        <section class="profileCard">

            <div class="avatarBox">

                <img

                id="profileAvatar"

                src="../../assets/images/default-avatar.png"

                alt="Avatar">

                <button

                id="changeAvatar">

                    Change Avatar

                </button>

                <input

                hidden

                type="file"

                id="avatarInput"

                accept="image/*">

            </div>

            <div class="profileInfo">

                <div class="field">

                    <label>

                        Username

                    </label>

                    <input

                    id="username"

                    type="text">

                </div>

                <div class="field">

                    <label>

                        Email

                    </label>

                    <input

                    id="email"

                    type="email"

                    readonly>

                </div>

                <div class="field">

                    <label>

                        Bio

                    </label>

                    <textarea

                    id="bio"

                    rows="4">

                    </textarea>

                </div>
