<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Cheem Coding | Settings

</title>

<link
rel="icon"
href="../../assets/logo/favicon.ico">

<link
rel="stylesheet"
href="../../css/root.css">

<link
rel="stylesheet"
href="../../css/theme.css">

<link
rel="stylesheet"
href="../../css/animation.css">

<link
rel="stylesheet"
href="settings.css">

</head>

<body>

<div class="settingsPage">

    <!-- Sidebar -->

    <aside class="settingsSidebar">

        <div class="settingsLogo">

            <img

            src="../../assets/logo/OIP.jpg"

            alt="Cheem">

            <h2>

                Cheem Coding

            </h2>

        </div>

        <nav>

            <a href="../chat/index.html">

                💬 Chat

            </a>

            <a href="../profile/index.html">

                👤 Profile

            </a>

            <a

            class="active"

            href="./index.html">

                ⚙ Settings

            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="settingsMain">

        <header class="settingsHeader">

            <h1>

                Cài đặt

            </h1>

            <span>

                Chat Cheem Coding - Meoz building

            </span>

        </header>

        <section class="settingsCard">

            <h2>

                Giao diện

            </h2>

            <div class="settingItem">

                <label>

                    Theme

                </label>

                <select

                id="theme">

                    <option value="dark">

                        Dark

                    </option>

                    <option value="light">

                        Light

                    </option>

                    <option value="system">

                        System

                    </option>

                </select>

            </div>

            <div class="settingItem">

                <label>

                    Font Size

                </label>

                <input

                id="fontSize"

                type="range"

                min="12"

                max="24"

                value="15">

            </div>

            <div class="settingItem">

                <label>

                    Language

                </label>

                <select

                id="language">

                    <option value="vi">

                        Vietnamese

                    </option>

                    <option value="en">

                        English

                    </option>

                </select>

            </div>
                        <h2>

                AI & Chat

            </h2>

            <div class="settingItem">

                <label>

                    Default Model

                </label>

                <select id="model">

                    <option value="gpt-5.5">

                        GPT-5.5

                    </option>

                    <option value="gpt-5.5-mini">

                        GPT-5.5 Mini

                    </option>

                </select>

            </div>

            <div class="settingItem">

                <label>

                    Markdown

                </label>

                <input

                id="markdown"

                type="checkbox">

            </div>

            <div class="settingItem">

                <label>

                    Stream Response

                </label>

                <input

                id="stream"

                type="checkbox">

            </div>

            <div class="settingItem">

                <label>

                    Watermark

                </label>

                <input

                id="watermark"

                type="checkbox">

            </div>

            <div class="settingItem">

                <label>

                    Notification

                </label>

                <input

                id="notification"

                type="checkbox">

            </div>

            <div class="settingItem">

                <label>

                    Sound

                </label>

                <input

                id="sound"

                type="checkbox">

            </div>

            <div class="settingItem">

                <label>

                    Auto Save

                </label>

                <input

                id="autoSave"

                type="checkbox">

            </div>

        </section>

        <section class="settingsActions">

            <button id="saveSettings">

                Save

            </button>

            <button id="resetSettings">

                Reset

            </button>

            <button id="exportSettings">

                Export

            </button>

            <button id="importSettings">

                Import

            </button>

            <input

            hidden

            id="importFile"

            type="file"

            accept=".json">

        </section>

    </main>

</div>

<footer class="settingsFooter">

    <span>

        Chat Cheem Coding - Meoz building

    </span>

</footer>

<script src="../../js/storage.js"></script>

<script src="../../js/utils.js"></script>

<script src="../chat/settings.js"></script>

<script src="settings.js"></script>

</body>

</html>
